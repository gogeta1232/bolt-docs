name: Sync commands from Bolt-OS

on:
  schedule:
    - cron: '17 3 * * *' # nightly fallback
  workflow_dispatch:
  repository_dispatch:
    types: [bolt-os-commands-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch commands.json from Bolt-OS
        run: npm run sync:commands
        env:
          COMMANDS_URL: https://raw.githubusercontent.com/gogeta1232/Bolt-OS/main/site/src/data/commands.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/commands.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/commands.json
          git commit -m "chore(docs): sync commands.json from Bolt-OS"
          git push
